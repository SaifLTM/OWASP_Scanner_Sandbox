name: SAST Scan

on:
  push:
  pull_request:

jobs:
  sast:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout OWASP Insecure Application repo
        run: |
          git clone --depth=1 https://github.com/baigsf/OWASP_Insecure_Application
          echo "SCAN_REPOSITORY=baigsf/OWASP_Insecure_Application" >> "$GITHUB_ENV"
          echo "SCAN_REPO_SHA=$(git -C OWASP_Insecure_Application rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Semgrep
        run: |
          python3 -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep
        run: |
          mkdir -p output
          semgrep scan \
            --config=p/owasp-top-ten \
            --json \
            ./OWASP_Insecure_Application > output/results.json

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz

          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

          gitleaks version

      - name: Run Gitleaks secret scan
        run: |
          mkdir -p output

          gitleaks detect \
            --source="./OWASP_Insecure_Application" \
            --report-format=json \
            --report-path="output/gitleaks-results.json" \
            --redact=100 \
            --exit-code=0

          if [ ! -f output/gitleaks-results.json ]; then
            echo "[]" > output/gitleaks-results.json
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java, javascript, python
          queries: security-extended,security-and-quality
          source-root: ./OWASP_Insecure_Application
          build-mode: none

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: output/codeql-results

      - name: Show generated scan files
        run: |
          echo "Generated scan files:"
          find output -type f || true

      - name: Generate HTML report
        run: |
          python3 scripts/generate_report.py

      - name: Show final output files
        run: |
          echo "Final output files:"
          find output -type f || true

      - name: Upload HTML dashboard
        uses: actions/upload-artifact@v4
        with:
          name: sast-dashboard
          path: output/security-report.html
